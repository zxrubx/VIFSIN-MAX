<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="MAX Institute Feedback Bot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e0e7ff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="1080" cy="-20" r="180" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="1140" cy="300" r="140" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="60" cy="320" r="110" fill="#ffffff" fill-opacity="0.06"/>

  <!-- chat bubbles -->
  <g filter="url(#shadow)">
    <path d="M820 60h250a22 22 0 0 1 22 22v62a22 22 0 0 1-22 22H900l-34 28v-28h-46a22 22 0 0 1-22-22V82a22 22 0 0 1 22-22z" fill="url(#bubble)"/>
    <rect x="846" y="88" width="190" height="12" rx="6" fill="#6366f1" fill-opacity="0.85"/>
    <rect x="846" y="112" width="140" height="12" rx="6" fill="#6366f1" fill-opacity="0.45"/>
    <path d="M930 196h200a22 22 0 0 1 22 22v32a22 22 0 0 1-22 22h-24v24l-34-24H930a22 22 0 0 1-22-22v-32a22 22 0 0 1 22-22z" fill="#10b981"/>
    <path d="M958 234l14 14 28-30" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1018" y="226" width="90" height="10" rx="5" fill="#fff" fill-opacity="0.9"/>
    <rect x="1018" y="244" width="60" height="10" rx="5" fill="#fff" fill-opacity="0.55"/>
  </g>

  <text x="64" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff">Bot MAX Institute</text>
  <text x="66" y="176" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#e0e7ff">Обратная связь от студентов в мессенджере MAX</text>
  <text x="66" y="222" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#c7d2fe">анонимно · с модерацией · с уведомлениями о статусе</text>
</svg>
