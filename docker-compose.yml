# docker compose up -d --build
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/reports.db
    volumes:
      - ./data:/app/data

  admin:
    build: .
    restart: unless-stopped
    command: uvicorn admin.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DB_PATH: /app/data/reports.db
    volumes:
      - ./data:/app/data
    # наружу — только на localhost; для доступа извне ставьте reverse proxy с HTTPS (Basic Auth по HTTP небезопасен)
    ports:
      - "127.0.0.1:8000:8000"
